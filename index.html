<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0d0a12" />
    <title>Monastery · Carta</title>
    <!--
      Table QR entry point (published at https://sebastianprogramadorcoffe.github.io/monastery/).
      Phone scanners such as Xiaomi's treat *.dev links as plain text, so the printed QR points
      here (github.io, which they open) and this page forwards to the menu on pages.dev.
      Only a 32-hex table token is passed on, and only to our own menu: never an open redirect.
    -->
    <script>
      (function () {
        var menu = 'https://monastery-9wo.pages.dev/carta';
        var t = new URLSearchParams(window.location.search).get('t') || '';
        var target = /^[0-9a-f]{32}$/.test(t) ? menu + '?t=' + t : menu;
        window.location.replace(target);
        document.addEventListener('DOMContentLoaded', function () {
          document.getElementById('go').href = target;
        });
      })();
    </script>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: grid;
        place-items: center;
        background: #0d0a12;
        color: #f3eefa;
        font-family: system-ui, sans-serif;
        text-align: center;
      }
      h1 {
        margin: 0 0 8px;
        color: #ff3d8b;
        font-size: 2.5rem;
        text-shadow: 0 0 12px rgba(255, 61, 139, 0.6);
      }
      a {
        color: #35dff2;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Monastery</h1>
      <p>Abriendo la carta…</p>
      <p><a id="go" href="https://monastery-9wo.pages.dev/carta">Toca aquí si no abre</a></p>
    </main>
  </body>
</html>
